    <style>
        /* Design Variables Architecture */
        :root {
            --primary: #00adb5;
            --primary-glow: rgba(0, 173, 181, 0.4);
            --bg-dark: #03050a;
            --text-main: #f3f4f6;
            --text-muted: #64748b;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.04);
            --input-bg: rgba(255,255,255,0.01);
            --btn-txt: #000000;
            --btn-bg: #ffffff;
            --cv-shadow: rgba(0,0,0,0.5);
        }

        /* Light Mode Variable Adaptations */
        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass: rgba(15, 23, 42, 0.03);
            --glass-border: rgba(15, 23, 42, 0.08);
            --input-bg: #ffffff;
            --btn-txt: #ffffff;
            --btn-bg: #0f172a;
            --cv-shadow: rgba(15,23,42,0.15);
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

        body, html { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        #canvas3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        .wrapper { position: relative; z-index: 2; max-width: 900px; margin: auto; padding: 40px 20px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
        .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }

        /* Theme Toggle Interface Node */
        .theme-toggle {
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 10px 16px; border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 600;
        }
        .theme-toggle:hover { border-color: var(--primary); }

        .assistant-box {
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; margin-bottom: 60px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .assistant-box h2 { font-size: 1.3rem; font-weight: 500; margin-top: 0; margin-bottom: 15px; }
        .options-row { display: flex; flex-wrap: wrap; gap: 12px; }
        
        .opt-btn {
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 12px 20px; border-radius: 30px; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 0.9rem;
        }
        .opt-btn:hover { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-2px); }

        .section-container { margin-bottom: 80px; padding: 25px; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass); backdrop-filter: blur(5px); }
        .section-container.highlight { animation: flashGlow 1.5s ease-out; }

        @keyframes flashGlow {
            0% { border-color: var(--primary); box-shadow: 0 0 30px var(--primary-glow); }
            100% { border-color: var(--glass-border); box-shadow: none; }
        }

        .tool-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 5px; }
        .tool-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 25px; font-weight: 300; }

        input[type="text"], input[type="number"], textarea, select {
            width: 100%; background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 16px; font-size: 1rem; font-family: inherit; margin-bottom: 20px;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
        input[type="file"] { padding: 14px; background: var(--input-bg); border: 1px dashed var(--glass-border); border-radius: 12px; cursor: pointer; width: 100%; color: var(--text-muted); margin-bottom: 15px; }

        button.action-btn {
            background: var(--btn-bg); color: var(--btn-txt); border: none; border-radius: 12px;
            padding: 16px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; font-family: inherit; margin-top: 10px;
        }
        button.action-btn:hover { background: var(--primary); color: #fff; box-shadow: 0 10px 25px var(--primary-glow); }

        .status-node { background: var(--glass); padding: 14px; border-radius: 10px; margin-top: 20px; text-align: center; font-size: 0.9rem; border-left: 3px solid var(--primary); color: var(--text-muted); }
        img.output-view { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 20px; display: none; }
        #qrcode-view { display: flex; justify-content: center; margin-top: 20px; padding: 15px; background: white; width: 170px; margin-left: auto; margin-right: auto; border-radius: 8px; }
        .timer-numeric { font-size: 4rem; font-weight: 300; text-align: center; margin: 20px 0; letter-spacing: -2px; }

        /* CV Premium Render Output Window Setup */
        #cv-container { background: #ffffff; color: #1a202c; padding: 50px; border-radius: 8px; margin-top: 30px; box-shadow: 0 30px 60px var(--cv-shadow); max-width: 100%; }
        .cv-identity h1 { font-size: 2.2rem; font-weight: 700; margin: 0; color: #1a202c; letter-spacing: -1px; text-align: left; }
        .cv-identity .role { font-size: 0.95rem; text-transform: uppercase; color: #00adb5; font-weight: 600; margin-top: 5px; letter-spacing: 1px; }
        .cv-identity .meta { font-size: 0.85rem; color: #718096; margin-top: 5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        .cv-block { margin-top: 25px; }
        .cv-block h4 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #1a202c; margin: 0 0 8px 0; font-weight: 700; border-bottom: 1px solid #edf2f7; padding-bottom: 4px; text-align: left;}
        .cv-block p { margin: 0; line-height: 1.6; color: #4a5568; font-size: 0.95rem; white-space: pre-line; text-align: left; }
    </style>
